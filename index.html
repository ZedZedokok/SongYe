<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ffd93d">
<title>YeYeYeYe · P4 学习乐园</title>
<style>
:root{
  --bg:#fff8e7; --ink:#33302b; --soft:#8a8272; --card:#ffffff; --line:#f0e6cf;
  --en:#0f9b8e; --ma:#f5a623; --sc:#3cb371; --cl:#e2604a;
  --star:#ffb703; --good:#2eaa6e; --bad:#e05252;
  --shadow:0 6px 0 rgba(0,0,0,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0;font-family:"Nunito","Arial Rounded MT Bold","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);overscroll-behavior:none;
  background-image:radial-gradient(#ffe9a8 8%, transparent 9%),radial-gradient(#ffe9a8 8%, transparent 9%);
  background-size:46px 46px;background-position:0 0,23px 23px;}
#app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}
/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;}
.top .logo{font-weight:900;font-size:1.35rem;letter-spacing:.5px;}
.logo .c1{color:var(--en);}.logo .c2{color:var(--ma);}.logo .c3{color:var(--sc);}.logo .c4{color:var(--cl);}
.starbox{margin-left:auto;background:#fff;border:2.5px solid var(--star);border-radius:99px;padding:5px 14px;font-weight:900;font-size:1.05rem;box-shadow:var(--shadow);}
.starbox.pop{animation:pop .4s;}
@keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.35) rotate(-6deg);}100%{transform:scale(1);}}
/* ---------- screens ---------- */
.screen{flex:1;padding:8px 16px 96px;display:none;}
.screen.show{display:block;animation:fadein .25s;}
@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
/* ---------- home ---------- */
.mascot{display:flex;gap:12px;align-items:center;background:#fff;border-radius:20px;border:2.5px solid var(--line);padding:14px;box-shadow:var(--shadow);}
.mascot .face{font-size:3rem;animation:bob 2.6s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-6px) rotate(4deg);}}
.mascot .bubble{font-size:1rem;font-weight:800;line-height:1.5;}
.mascot .bubble small{display:block;color:var(--soft);font-weight:700;}
.ringwrap{display:flex;gap:14px;align-items:center;background:#fff;border-radius:20px;border:2.5px solid var(--line);padding:14px;margin-top:12px;box-shadow:var(--shadow);}
.ring{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--star) calc(var(--p)*1%), #f1ead6 0);}
.ring>div{width:64px;height:64px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:900;font-size:1rem;}
.ringtext{font-weight:800;line-height:1.6;}
.ringtext small{color:var(--soft);font-weight:700;display:block;}
.homebtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
.bigbtn{border:none;border-radius:18px;padding:16px;font-size:1.02rem;font-weight:900;cursor:pointer;font-family:inherit;color:#fff;box-shadow:var(--shadow);transition:.1s transform;}
.bigbtn:active{transform:scale(.94) rotate(-1deg);}
.bigbtn.report{background:linear-gradient(135deg,#7c6cf0,#a58cf5);}
.bigbtn.game{background:linear-gradient(135deg,#ff8a3d,#ffb703);}
.bigbtn.eb{background:linear-gradient(135deg,#5aa9ff,#7cc4ff);}
.bigbtn.io{background:#fff;color:var(--ink);border:2.5px solid var(--line);}
.bigbtn:disabled{opacity:.45;transform:none;}
/* ---------- subject module cards ---------- */
.subjhead{display:flex;align-items:center;gap:10px;margin:8px 0 12px;}
.subjhead .ic{font-size:2rem;}
.subjhead h2{margin:0;font-size:1.25rem;font-weight:900;}
.subjhead .sub{font-size:.78rem;color:var(--soft);font-weight:700;}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.mode-card{background:var(--card);border:2.5px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;box-shadow:var(--shadow);transition:.12s transform;position:relative;overflow:hidden;}
.mode-card:nth-child(odd){transform:rotate(-.6deg);}
.mode-card:nth-child(even){transform:rotate(.6deg);}
.mode-card:active{transform:scale(.93) rotate(0deg);}
.mode-card .mi{font-size:1.9rem;}
.mode-card .mt{font-weight:900;margin-top:6px;font-size:.98rem;}
.mode-card .md{font-size:.74rem;color:var(--soft);margin-top:3px;line-height:1.45;font-weight:700;}
.mode-card .stripe{position:absolute;top:0;left:0;right:0;height:6px;}
/* ---------- quiz ---------- */
.qwrap{background:#fff;border:2.5px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);}
.qtop{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--soft);font-weight:800;}
.qtop .quit{margin-left:auto;background:none;border:none;font-size:1.1rem;cursor:pointer;}
.bar{height:12px;background:#f1ead6;border-radius:99px;overflow:hidden;margin-top:8px;}
.bar>div{height:100%;background:linear-gradient(90deg,var(--star),#ff8a3d);width:0%;transition:.35s;border-radius:99px;}
.qtext{font-size:1.15rem;line-height:1.7;margin:14px 0;white-space:pre-wrap;font-weight:800;}
.opts{display:grid;gap:10px;}
.opt{background:#fffdf6;border:2.5px solid var(--line);border-radius:14px;padding:13px 15px;font-size:1.02rem;cursor:pointer;text-align:left;font-family:inherit;font-weight:800;transition:.1s transform;}
.opt:active{transform:scale(.96);}
.opt.correct{border-color:var(--good);background:#e9f9f0;animation:yay .35s;}
.opt.wrong{border-color:var(--bad);background:#fdeeee;animation:shake .3s;}
@keyframes yay{50%{transform:scale(1.04);}}
@keyframes shake{25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
input.ans,textarea.ans{width:100%;font-size:1.1rem;padding:12px;border:2.5px solid var(--line);border-radius:14px;font-family:inherit;font-weight:800;background:#fffdf6;}
textarea.ans{min-height:84px;}
.checkbtn{margin-top:10px;background:linear-gradient(135deg,var(--good),#4cc98a);color:#fff;border:none;border-radius:14px;padding:12px 22px;font-size:1rem;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:var(--shadow);}
.checkbtn:active{transform:scale(.95);}
.fb{font-weight:900;margin-top:12px;display:none;font-size:1.05rem;}
.fb.good{color:var(--good);}.fb.bad{color:var(--bad);}.fb.part{color:#c77700;}
.explain{margin-top:10px;padding:12px;border-radius:14px;background:#fff6dd;font-size:.9rem;line-height:1.6;display:none;white-space:pre-wrap;font-weight:700;}
.nextbtn{margin-top:14px;background:linear-gradient(135deg,#5aa9ff,#7cc4ff);color:#fff;border:none;border-radius:14px;padding:12px 26px;font-size:1rem;font-weight:900;cursor:pointer;font-family:inherit;display:none;box-shadow:var(--shadow);}
.speak-btn{font-size:2.4rem;background:#fff6dd;border:3px solid var(--star);border-radius:50%;width:84px;height:84px;cursor:pointer;display:none;margin:4px auto 10px;transition:.1s transform;}
.speak-btn:active{transform:scale(.9);}
.tts-warn{display:none;background:#fff2cc;border:2px solid #e8c66a;border-radius:12px;padding:10px;font-size:.82rem;margin:10px 0;font-weight:700;line-height:1.5;}
/* ---------- handwriting ---------- */
.hwrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 4px;}
.hwbox{position:relative;}
.hwbox canvas{background:#fff;border:2.5px solid #e0b7ae;border-radius:10px;touch-action:none;display:block;}
.hwans{position:absolute;inset:0;display:none;place-items:center;font-size:74px;color:rgba(226,96,74,.5);font-family:"Kaiti SC","KaiTi","STKaiti",serif;pointer-events:none;font-weight:400;}
.hwctrl{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
.hwctrl button{background:#fff;border:2.5px solid var(--line);border-radius:12px;padding:9px 14px;font-size:.9rem;font-weight:900;cursor:pointer;font-family:inherit;}
.selfmark{display:none;gap:10px;justify-content:center;margin-top:12px;}
.selfmark button{border:none;border-radius:14px;padding:12px 20px;font-size:1rem;font-weight:900;cursor:pointer;font-family:inherit;color:#fff;box-shadow:var(--shadow);}
.selfmark .yes{background:var(--good);}
.selfmark .no{background:var(--bad);}
/* ---------- result ---------- */
.resultcard{background:#fff;border:2.5px solid var(--line);border-radius:22px;padding:26px 18px;text-align:center;box-shadow:var(--shadow);}
.resultcard .big{font-size:3rem;font-weight:900;}
.resultcard .stars{font-size:1.6rem;margin:6px 0;}
.resultcard .msg{font-weight:800;color:var(--soft);}
/* ---------- report ---------- */
.rep{background:#fff;border:2.5px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);}
.rep h3{margin:2px 0 12px;font-size:1.15rem;}
.repbar{margin:10px 0;}
.repbar .lab{display:flex;justify-content:space-between;font-size:.85rem;font-weight:900;margin-bottom:4px;}
.repbar .track{height:16px;background:#f1ead6;border-radius:99px;overflow:hidden;}
.repbar .fill{height:100%;width:0%;border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.2,1);}
.repnote{font-size:.85rem;font-weight:800;background:#fff6dd;border-radius:12px;padding:10px;margin-top:12px;line-height:1.6;}
/* ---------- tabbar ---------- */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2.5px solid var(--line);display:flex;max-width:760px;margin:0 auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50;}
.tab{flex:1;background:none;border:none;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;font-weight:900;color:var(--soft);font-size:.68rem;transition:.1s transform;}
.tab .ti{font-size:1.5rem;transition:.15s transform;}
.tab.active{color:var(--ink);}
.tab.active .ti{transform:scale(1.22) translateY(-2px);}
.tab:active{transform:scale(.9);}
/* ---------- confetti & fx ---------- */
.confetti{position:fixed;font-size:1.4rem;pointer-events:none;z-index:99;animation:conf .9s ease-out forwards;}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0;}}
/* ---------- game ---------- */
#gameOverlay{position:fixed;inset:0;background:rgba(20,16,8,.85);z-index:200;display:none;place-items:center;}
#gameBox{width:min(94vw,560px);background:#fff8e7;border-radius:22px;padding:14px;text-align:center;}
#gameBox h3{margin:4px 0 8px;}
#gameCanvas{background:linear-gradient(#2b3a67,#4a3f78);border-radius:14px;touch-action:none;width:100%;display:block;}
#gameBox .ginfo{display:flex;justify-content:space-between;font-weight:900;padding:6px 4px;}
#gameBox button{margin-top:10px;}
.pill{background:#fff;border:2.5px solid var(--line);border-radius:99px;padding:8px 18px;font-weight:900;cursor:pointer;font-family:inherit;font-size:.95rem;}
@media(max-width:430px){.mode-grid{grid-template-columns:1fr 1fr;}.hwbox canvas{width:130px;height:130px;}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="logo"><span class="c1">Ye</span><span class="c2">Ye</span><span class="c3">Ye</span><span class="c4">Ye</span> <span style="font-size:.8rem;color:var(--soft);font-weight:800">P4 学习乐园</span></div>
    <div class="starbox" id="starBox">⭐ <span id="starCount">0</span></div>
  </div>

  <!-- HOME -->
  <div class="screen show" id="scr-home">
    <div class="mascot"><div class="face">🦁</div><div class="bubble" id="mascotSay">你好呀！<small>今天也一起加油吧！</small></div></div>
    <div class="ringwrap">
      <div class="ring" id="goalRing" style="--p:0"><div id="goalPct">0%</div></div>
      <div class="ringtext">今日任务：完成 <b id="goalTotal">20</b> 道题<small id="goalDone">已完成 0 题 · 做完解锁🎮和🏅报告</small></div>
    </div>
    <div class="homebtns">
      <button class="bigbtn report" onclick="showReport()">🏅 今日报告</button>
      <button class="bigbtn game" id="gameBtn" onclick="tryGame()">🎮 奖励游戏</button>
      <button class="bigbtn eb" onclick="startErrorRound()">📕 错题闯关（<span id="ebCount">0</span>）</button>
      <button class="bigbtn io" onclick="exportData()">💾 备份 / <span onclick="event.stopPropagation();document.getElementById('impFile').click()" style="text-decoration:underline">导入</span></button>
      <input type="file" id="impFile" accept=".json" style="display:none" onchange="importData(this)">
    </div>
    <div class="tts-warn" id="ttsWarn">⚠️ 这台设备没有中文语音，听写会显示拼音提示。iPad：设置→辅助功能→朗读内容→声音→中文，下载语音包。</div>
    <div id="reportArea"></div>
  </div>

  <!-- SUBJECT SCREENS -->
  <div class="screen" id="scr-en"></div>
  <div class="screen" id="scr-ma"></div>
  <div class="screen" id="scr-sc"></div>
  <div class="screen" id="scr-cl"></div>

  <!-- QUIZ -->
  <div class="screen" id="scr-quiz">
    <div class="qwrap">
      <div class="qtop"><span id="qnum"></span><button class="quit" onclick="quitRound()">✖</button></div>
      <div class="bar"><div id="barFill"></div></div>
      <button class="speak-btn" id="speakBtn" onclick="speakCurrent()">🔊</button>
      <div class="qtext" id="qtext"></div>
      <div class="opts" id="opts"></div>
      <div id="typedWrap" style="display:none">
        <input class="ans" id="typedAns" autocomplete="off" placeholder="在这里输入答案">
        <button class="checkbtn" onclick="submitTyped()">检查 ✔</button>
      </div>
      <div id="openWrap" style="display:none">
        <textarea class="ans" id="openAns" placeholder="Answer in full sentences using science words"></textarea>
        <button class="checkbtn" onclick="submitOpen()">Check my answer ✔</button>
      </div>
      <div id="hwWrap" style="display:none">
        <div class="hwrow" id="hwRow"></div>
        <div class="hwctrl">
          <button onclick="hwClear()">🧽 重写</button>
          <button onclick="hwReveal()">👀 对答案</button>
        </div>
        <div class="selfmark" id="selfMark">
          <button class="yes" onclick="hwMark(true)">✓ 我写对了</button>
          <button class="no" onclick="hwMark(false)">✗ 有错字</button>
        </div>
      </div>
      <div class="fb" id="fb"></div>
      <div class="explain" id="explain"></div>
      <button class="nextbtn" id="nextBtn" onclick="nextQ()">下一题 →</button>
    </div>
  </div>

  <!-- RESULT -->
  <div class="screen" id="scr-done"></div>

  <div class="tabbar">
    <button class="tab active" data-scr="home" onclick="go('home')"><span class="ti">🏠</span>今日</button>
    <button class="tab" data-scr="en" onclick="go('en')"><span class="ti">📖</span>English</button>
    <button class="tab" data-scr="ma" onclick="go('ma')"><span class="ti">➗</span>Maths</button>
    <button class="tab" data-scr="sc" onclick="go('sc')"><span class="ti">🔬</span>Science</button>
    <button class="tab" data-scr="cl" onclick="go('cl')"><span class="ti">✍️</span>华文</button>
  </div>
</div>

<!-- GAME -->
<div id="gameOverlay">
  <div id="gameBox">
    <h3>🌟 接星星 · 奖励关</h3>
    <div class="ginfo"><span>得分 <b id="gScore">0</b></span><span>⏱ <b id="gTime">30</b>s</span></div>
    <canvas id="gameCanvas" width="520" height="380"></canvas>
    <div style="font-size:.8rem;font-weight:800;color:#6b6250;margin-top:6px">点⭐得分，别点💣！游戏得分会变成星星奖励～</div>
    <button class="pill" id="gBtn" onclick="gameStart()">开始！</button>
    <button class="pill" onclick="gameClose()">返回</button>
  </div>
</div>

<script data-core>

// ================= CORE (DOM-free, testable) =================
var MA_CORE=(function(){
  function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
  function pick(arr){return arr[ri(0,arr.length-1)];}
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=ri(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function gcd(a,b){return b?gcd(b,a%b):a;}
  function uniqOpts(correct, wrongs){
    var set=[String(correct)];
    wrongs.forEach(function(w){ w=String(w); if(set.indexOf(w)===-1) set.push(w); });
    while(set.length<4){ var extra=String(Number(correct)+ri(1,9)*(Math.random()<.5?-1:1)); if(set.indexOf(extra)===-1 && Number(extra)>=0) set.push(extra); }
    return shuffle(set.slice(0,4));
  }
  // Build exactly 4 UNIQUE options; filler(i) supplies extra distractors on collision
  function uniq4(correct, wrongs, filler){
    var set=[String(correct)];
    wrongs.forEach(function(w){ w=String(w); if(set.indexOf(w)===-1) set.push(w); });
    for(var i=1;set.length<4&&i<60;i++){ var f=String(filler(i)); if(set.indexOf(f)===-1) set.push(f); }
    return shuffle(set.slice(0,4));
  }

  // ---- Generator: Number Sense (place value, rounding, factors & multiples) ----
  function genNumber(){
    var kind=ri(1,4);
    if(kind===1){ // place value up to 100,000
      var n=ri(10000,99999);
      var digits=String(n).split('');
      var pos=ri(0,4);
      var names=["ten thousands","thousands","hundreds","tens","ones"];
      var vals=[10000,1000,100,10,1];
      var d=Number(digits[pos]);
      var correct=d*vals[pos];
      return {type:"mcq", q:"In the number "+n.toLocaleString('en-US')+", what is the VALUE of the digit "+d+" in the "+names[pos]+" place?",
        options:uniqOpts(correct,[d, d*vals[Math.max(0,pos-1)], d*vals[Math.min(4,pos+1)]]),
        answer:String(correct),
        explain:"The digit "+d+" is in the "+names[pos]+" place, so its value is "+d+" × "+vals[pos].toLocaleString('en-US')+" = "+correct.toLocaleString('en-US')+"."};
    }
    if(kind===2){ // rounding
      var n2=ri(1234,98765);
      var to=pick([10,100,1000]);
      var correct2=Math.round(n2/to)*to;
      return {type:"mcq", q:"Round "+n2.toLocaleString('en-US')+" to the nearest "+to.toLocaleString('en-US')+".",
        options:uniqOpts(correct2,[correct2+to,correct2-to,Math.floor(n2/to)*to===correct2?correct2+2*to:Math.floor(n2/to)*to]),
        answer:String(correct2),
        explain:"Look at the digit to the right of the "+(to===10?"tens":to===100?"hundreds":"thousands")+" place. 5 or more → round up; 4 or less → round down. Answer: "+correct2.toLocaleString('en-US')+"."};
    }
    if(kind===3){ // factors
      var base=pick([24,36,48,60,72,84,96]);
      var facs=[]; for(var f=1;f<=base;f++) if(base%f===0) facs.push(f);
      var notFac=ri(2,12); while(base%notFac===0) notFac=ri(2,13);
      var opts=shuffle([String(notFac)].concat(shuffle(facs.filter(function(x){return x>1&&x<base;})).slice(0,3).map(String)));
      return {type:"mcq", q:"Which of the following is NOT a factor of "+base+"?",
        options:opts, answer:String(notFac),
        explain:base+" ÷ "+notFac+" leaves a remainder, so "+notFac+" is not a factor. Factors of "+base+": "+facs.join(", ")+"."};
    }
    // multiples: common multiple
    var a=pick([2,3,4,5,6]), b=pick([3,4,5,6,8]); while(b===a) b=pick([3,4,5,6,8]);
    var lcm=a*b/gcd(a,b);
    var k=ri(1,3); var correct3=lcm*k;
    return {type:"mcq", q:"Which number is a common multiple of "+a+" and "+b+"?",
      options:uniqOpts(correct3,[a*ri(1,9)===correct3?a*7+1:a* ri(1,9), b* ri(1,9)===correct3?b*7+1:b*ri(1,9), correct3+1]),
      answer:String(correct3),
      explain:"A common multiple must be divisible by both "+a+" and "+b+". "+correct3+" ÷ "+a+" = "+(correct3/a)+" and "+correct3+" ÷ "+b+" = "+(correct3/b)+"."};
  }

  // ---- Generator: Fractions (P4: like & related denominators, mixed numbers, fraction of set) ----
  function fstr(n,d){return n+"/"+d;}
  function genFraction(){
    var kind=ri(1,4);
    if(kind===1){ // equivalent fraction
      var d=pick([2,3,4,5,6]), n=ri(1,d-1); var g=gcd(n,d); n/=g; d/=g;
      var m=ri(2,5);
      var correct=fstr(n*m,d*m);
      return {type:"mcq", q:"Which fraction is equivalent to "+fstr(n,d)+"?",
        options:uniq4(correct, [fstr(n+m,d+m), fstr(n*m, d*(m+1)), fstr(n, d*m)], function(i){return fstr(n*m+i, d*m);}),
        answer:correct,
        explain:"Multiply the numerator and denominator by the SAME number: "+n+"×"+m+"="+(n*m)+", "+d+"×"+m+"="+(d*m)+". Adding the same number to top and bottom (like "+fstr(n+m,d+m)+") is the classic trap!"};
    }
    if(kind===2){ // mixed <-> improper
      var w=ri(1,4), d2=pick([3,4,5,6,8]), n2=ri(1,d2-1);
      var imp=w*d2+n2;
      if(Math.random()<.5){
        return {type:"mcq", q:"Express "+w+" "+fstr(n2,d2)+" as an improper fraction.",
          options:uniq4(fstr(imp,d2), [fstr(w+n2,d2), fstr(w*n2,d2), fstr(imp+1,d2)], function(i){return fstr(imp+1+i,d2);}),

    {type:"mcq",q:"（　）困难",options:["克服","打败","消灭","拒绝"],answer:"克服",explain:"固定搭配：克服困难。「打败」搭配对手，「消灭」搭配敌人。"},
    {type:"mcq",q:"（　）时间",options:["珍惜","珍贵","宝贵","爱护"],answer:"珍惜",explain:"「珍惜」是动词，搭配「时间」；「珍贵、宝贵」是形容词，不能直接带宾语。"},
    {type:"mcq",q:"一（　）大雨",options:["场","个","阵子","滴"],answer:"场",explain:"雨、雪、比赛、电影用「场」：一场大雨、一场比赛。"},
    {type:"mcq",q:"（　）态度",options:["端正","改正","纠正","修正"],answer:"端正",explain:"固定搭配：端正态度、改正错误、纠正发音。"},
    {type:"mcq",q:"一（　）骏马",options:["匹","只","头","条"],answer:"匹",explain:"马用「匹」；牛用「头」；狗、猫用「只」；鱼、蛇用「条」。"},
    {type:"mcq",q:"（　）知识",options:["丰富","增加","提高","扩大"],answer:"丰富",explain:"固定搭配：丰富知识、增加收入、提高水平、扩大范围。"},
    {type:"mcq",q:"一（　）眼镜",options:["副","双","对","只"],answer:"副",explain:"成套的东西用「副」：一副眼镜、一副手套、一副对联。"},
    {type:"mcq",q:"（　）承诺",options:["履行","实行","执行","进行"],answer:"履行",explain:"固定搭配：履行承诺/诺言、执行任务、实行计划。（高华水平）"}
  ];

  var MODULES={
    dict:{name:"听写练习",bank:DICT,n:8,dictation:true},
    pinyin:{name:"前后鼻音辨析",bank:PINYIN,n:8},
    dede:{name:"的地得专项",bank:DEDE,n:8},
    collo:{name:"词语搭配·量词",bank:COLLO,n:8}
  };
  function buildRound(id){
    var m=MODULES[id];
    if(m.dictation){
      return shuffle(m.bank).slice(0,m.n).map(function(x){
        return {type:"dictation",w:x.w,py:x.py,hint:x.hint,q:"听一听，写出词语（提示："+x.hint+"）",answer:x.w,explain:"正确写法："+x.w+"（"+x.py+"）"};
      });
    }
    return shuffle(m.bank).slice(0,m.n);
  }
  function checkTyped(q,given){
    return String(given).trim()===q.answer;
  }
  return {MODULES:MODULES,buildRound:buildRound,checkTyped:checkTyped,shuffle:shuffle};
})();

if(typeof module!=='undefined')module.exports={EN:EN_CORE,MA:MA_CORE,SC:SC_CORE,CL:CL_CORE};
</script>

<script>
/* ================= APP ENGINE ================= */
var KEY='ye_p4_app_v2';
var DB=load();
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.log)return d;}catch(e){}
  return {stars:0,log:[],errorBook:[],gamePlayedOn:''};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

var SUBJ={
  en:{name:'English',icon:'📖',color:'var(--en)',hex:'#0f9b8e',core:EN_CORE,
      icons:{grammar:"🔤",vocab:"💡",synthesis:"🔗",editing:"✏️",cloze:"🧩"},
      descs:{grammar:"Subject-verb · tenses · prepositions",vocab:"Words in context · idioms",synthesis:"Combine & rewrite — typed",editing:"Fix the wrong word — typed",cloze:"Fill the passage blanks"}},
  ma:{name:'Maths',icon:'➗',color:'var(--ma)',hex:'#f5a623',core:MA_CORE,
      icons:{number:"🔢",fraction:"🍕",decimal:"💰",geometry:"📐",word:"🧩"},
      descs:{number:"Place value · rounding · factors",fraction:"Equivalent · mixed · add & subtract",decimal:"Compare · + − ×",geometry:"Angles · nets · area · pie charts",word:"Two-step problems + hints"}},
  sc:{name:'Science',icon:'🔬',color:'var(--sc)',hex:'#3cb371',core:SC_CORE,
      icons:{matter:"🧊",light:"🔦",heat:"🌡️",body:"🫁",mixed:"📋",open:"✍️"},
      descs:{matter:"Solids · liquids · gases",light:"Shadows · opaque vs transparent",heat:"Heat flow · conductors",body:"Digestive system",mixed:"10-Q exam mode",open:"Booklet B · keyword marking"}},
  cl:{name:'高级华文',icon:'✍️',color:'var(--cl)',hex:'#e2604a',core:CL_CORE,
      icons:{dict:"🖌️",pinyin:"拼",dede:"的",collo:"🔗"},
      descs:{dict:"听音·手写汉字·自我批改",pinyin:"in/ing·en/eng·an/ang",dede:"名词的·动地·得程度",collo:"量词 + 固定搭配"}}
};
var GOAL=20;

/* ---------- navigation ---------- */
function go(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('show');});
  document.getElementById('scr-'+id).classList.add('show');
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.dataset.scr===id);});
  if(id==='home')renderHome();
  if(SUBJ[id])renderSubject(id);
}
function renderSubject(sid){
  var S=SUBJ[sid],el=document.getElementById('scr-'+sid);
  var html='<div class="subjhead"><span class="ic">'+S.icon+'</span><div><h2>'+S.name+'</h2><div class="sub">选一个模块开始 · 答对拿⭐</div></div></div><div class="mode-grid">';
  Object.keys(S.core.MODULES).forEach(function(k){
    html+='<div class="mode-card" onclick="startRound(\''+sid+'\',\''+k+'\')"><div class="stripe" style="background:'+S.hex+'"></div><div class="mi">'+S.icons[k]+'</div><div class="mt">'+S.core.MODULES[k].name+'</div><div class="md">'+S.descs[k]+'</div></div>';
  });
  el.innerHTML=html+'</div>';
}

/* ---------- daily stats ---------- */
function todayLog(){var t=today();return DB.log.filter(function(x){return x.d===t;});}
function todayQCount(){return todayLog().reduce(function(a,x){return a+x.n;},0);}
function goalReached(){return todayQCount()>=GOAL;}
function renderHome(){
  document.getElementById('starCount').textContent=DB.stars;
  document.getElementById('ebCount').textContent=DB.errorBook.length;
  var n=todayQCount(),p=Math.min(100,Math.round(n/GOAL*100));
  document.getElementById('goalRing').style.setProperty('--p',p);
  document.getElementById('goalPct').textContent=p+'%';
  document.getElementById('goalTotal').textContent=GOAL;
  document.getElementById('goalDone').textContent='已完成 '+n+' 题 · '+(goalReached()?'任务达成！🎉':'做完解锁🎮和🏅报告');
  document.getElementById('gameBtn').disabled=!goalReached();
  var says=goalReached()? ['任务完成，你太棒啦！','去玩接星星吧！🌟','记得看看今日报告哦～'] :
    ['今天也一起加油吧！','先来 8 道题热热身？','错题闯关能清空错题本哦！'];
  document.getElementById('mascotSay').innerHTML='你好呀，Ye！<small>'+says[Math.floor(Math.random()*says.length)]+'</small>';
}

/* ---------- round engine ---------- */
var round=[],idx=0,earned=0,maxMarks=0,qCount=0,modName='',curSid='';
function startRound(sid,mod){
  curSid=sid;
  round=SUBJ[sid].core.buildRound(mod).map(function(q){q.__sid=sid;return q;});
  modName=SUBJ[sid].core.MODULES[mod].name;
  beginRound();
}
function startErrorRound(){
  if(!DB.errorBook.length){alert('错题本是空的——太棒了！🎉');return;}
  round=shuffleA(DB.errorBook).slice(0,8);modName='错题闯关';curSid='';
  beginRound();
}
function beginRound(){
  idx=0;earned=0;maxMarks=0;qCount=0;
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('show');});
  document.getElementById('scr-quiz').classList.add('show');
  showQ();
}
function shuffleA(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function el(id){return document.getElementById(id);}
function hideAllInputs(){['opts','typedWrap','openWrap','hwWrap'].forEach(function(i){el(i).style.display= i==='opts'?'grid':'none';});el('opts').innerHTML='';el('speakBtn').style.display='none';}
function showQ(){
  var q=round[idx];
  el('barFill').style.width=(idx/round.length*100)+'%';
  el('qnum').textContent=modName+' · '+(idx+1)+' / '+round.length;
  el('fb').style.display='none';el('explain').style.display='none';el('nextBtn').style.display='none';
  hideAllInputs();
  if(q.type==='dictation'){
    el('qtext').textContent= ttsOK? '听一听，在米字格里写出词语 🖌️（'+q.hint+'）' : '🔇 按拼音写词：'+q.py+'（'+q.hint+'）';
    el('speakBtn').style.display='block';
    buildHw(q);
    setTimeout(speakCurrent,300);
  }else if(q.type==='open'){
    el('qtext').textContent=q.q;
    el('openWrap').style.display='block';var t=el('openAns');t.value='';t.disabled=false;
  }else if(q.type==='mcq'){
    el('qtext').textContent=q.q;
    shuffleA(q.options).forEach(function(o){
      var b=document.createElement('button');b.className='opt';b.textContent=o;
      b.onclick=function(){answerMcq(b,o,q);};
      el('opts').appendChild(b);
    });
  }else{ // typed
    el('qtext').textContent=q.q;
    el('typedWrap').style.display='block';var i=el('typedAns');i.value='';i.disabled=false;
  }
}
function answerMcq(btn,o,q){
  var ok=(String(o)===String(q.answer));
  document.querySelectorAll('.opt').forEach(function(b){
    b.disabled=true;
    if(b.textContent===String(q.answer))b.classList.add('correct');
  });
  if(!ok)btn.classList.add('wrong');
  scoreQ(ok?1:0,1,q, ok? null : '正确答案：'+q.answer);
}
function submitTyped(){
  var q=round[idx],v=el('typedAns').value;
  if(!v.trim())return;
  el('typedAns').disabled=true;
  var core=SUBJ[q.__sid||curSid].core;
  var ok=core.checkTyped(q,v);
  scoreQ(ok?1:0,1,q, ok?null:'参考答案：'+q.answer);
}
function submitOpen(){
  var q=round[idx],v=el('openAns').value;
  if(!v.trim())return;
  el('openAns').disabled=true;
  var r=SC_CORE.scoreOpen(q,v);
  var note= r.marks===r.max?null: (r.marks>0? '拿到 '+r.marks+'/'+r.max+' 分，漏了要点："'+r.missed.join('、')+'"':'0/'+r.max+' 分，评分要点："'+r.missed.join('、')+'"');
  scoreQ(r.marks,r.max,q,note,r.marks>0&&r.marks<r.max);
}
function scoreQ(got,max,q,note,partial){
  earned+=got;maxMarks+=max;qCount++;
  var full=(got===max);
  var fb=el('fb');fb.style.display='block';
  fb.className='fb '+(full?'good':partial?'part':'bad');
  fb.textContent= full? pick(['答对啦！🎉','太棒了！⭐','厉害！👍','Perfect! 🌟']) : (note||'再想想～');
  if(full){DB.stars+=got;popStars();burst();removeEB(q);}else addEB(q);
  var ex=el('explain');
  var txt=(q.model?('Model answer: '+q.model+'\n\n'):'')+(q.explain||'');
  if(txt){ex.style.display='block';ex.textContent=txt;}
  el('nextBtn').style.display='inline-block';
  save();
}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function qKey(q){return q.type==='dictation'?'d:'+q.w:q.q;}
function addEB(q){if(!DB.errorBook.some(function(e){return qKey(e)===qKey(q);}))DB.errorBook.push(q);}
function removeEB(q){DB.errorBook=DB.errorBook.filter(function(e){return qKey(e)!==qKey(q);});}
function nextQ(){idx++;if(idx>=round.length)return endRound();showQ();}
function quitRound(){go(curSid||'home');}
function endRound(){
  DB.log.push({d:today(),subj:curSid||'eb',mod:modName,score:earned,n:qCount,total:maxMarks});save();
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('show');});
  var d=el('scr-done');d.classList.add('show');
  var pct=maxMarks?Math.round(earned/maxMarks*100):0;
  var starRow='⭐'.repeat(Math.max(1,Math.round(pct/20)));
  var msg=pct===100?'满分！YeYeYeYe！🏆':pct>=75?'真棒，继续冲！':pct>=50?'不错！去错题闯关变更强！':'错题是升级的宝石，去收集吧！';
  d.innerHTML='<div class="resultcard"><div style="font-weight:900">'+modName+'</div><div class="big" style="color:'+(pct>=75?'var(--good)':'var(--ma)')+'">'+earned+' / '+maxMarks+'</div><div class="stars">'+starRow+'</div><div class="msg">'+msg+'</div><div class="homebtns" style="margin-top:16px"><button class="bigbtn report" onclick="showReport();go(\'home\');">🏅 看今日报告</button><button class="bigbtn game" onclick="go(\'home\');tryGame()" '+(goalReached()?'':'disabled')+'>🎮 奖励游戏</button></div><div style="margin-top:10px"><button class="pill" onclick="go(\''+(curSid||'home')+'\')">← 返回</button></div></div>';
  bigBurst();
}

/* ---------- confetti ---------- */
var EMOJI=['🎉','⭐','✨','🎈','🌟'];
function burst(){for(var i=0;i<8;i++)spawnConf(window.innerWidth/2,window.innerHeight/2.4);}
function bigBurst(){var n=0;var t=setInterval(function(){for(var i=0;i<10;i++)spawnConf(Math.random()*window.innerWidth,window.innerHeight/3);if(++n>4)clearInterval(t);},180);}
function spawnConf(x,y){
  var s=document.createElement('span');s.className='confetti';s.textContent=pick(EMOJI);
  s.style.left=x+'px';s.style.top=y+'px';
  s.style.setProperty('--dx',(Math.random()*260-130)+'px');
  s.style.setProperty('--dy',(Math.random()*-240-40)+'px');
  s.style.setProperty('--rot',(Math.random()*360-180)+'deg');
  document.body.appendChild(s);setTimeout(function(){s.remove();},950);
}
function popStars(){var b=el('starBox');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');el('starCount').textContent=DB.stars;}

/* ---------- TTS ---------- */
var zhVoice=null,ttsOK=false;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  var v=speechSynthesis.getVoices();
  zhVoice=v.find(function(x){return x.lang==='zh-CN';})||v.find(function(x){return x.lang&&x.lang.indexOf('zh')===0;})||null;
  ttsOK=!!zhVoice;
  el('ttsWarn').style.display=ttsOK?'none':'block';
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
else document.addEventListener('DOMContentLoaded',function(){el('ttsWarn').style.display='block';});
function speak(t){
  if(!ttsOK)return false;
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';if(zhVoice)u.voice=zhVoice;u.rate=0.8;speechSynthesis.speak(u);return true;}catch(e){return false;}
}
function speakCurrent(){var q=round[idx];if(q&&q.w)speak(q.w);}

/* ---------- handwriting (米字格) ---------- */
var hwCanvases=[];
function buildHw(q){
  el('hwWrap').style.display='block';
  el('selfMark').style.display='none';
  var row=el('hwRow');row.innerHTML='';hwCanvases=[];
  for(var i=0;i<q.w.length;i++){
    var box=document.createElement('div');box.className='hwbox';
    var c=document.createElement('canvas');c.width=150;c.height=150;
    var ans=document.createElement('div');ans.className='hwans';ans.textContent=q.w[i];
    box.appendChild(c);box.appendChild(ans);row.appendChild(box);
    initCanvas(c);hwCanvases.push(c);
  }
}
function initCanvas(c){
  var ctx=c.getContext('2d');
  drawGuide(ctx,c.width,c.height);
  var drawing=false,last=null;
  function pos(e){var r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*(c.width/r.width),y:(e.clientY-r.top)*(c.height/r.height)};}
  c.addEventListener('pointerdown',function(e){e.preventDefault();drawing=true;last=pos(e);c.setPointerCapture(e.pointerId);});
  c.addEventListener('pointermove',function(e){
    if(!drawing)return;e.preventDefault();
    var p=pos(e);ctx.strokeStyle='#2b2b2b';ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){c.addEventListener(ev,function(){drawing=false;});});
}
function drawGuide(ctx,w,h){
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='#f0c8bf';ctx.lineWidth=1.5;ctx.setLineDash([6,5]);
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(w,h);ctx.moveTo(w,0);ctx.lineTo(0,h);
  ctx.moveTo(w/2,0);ctx.lineTo(w/2,h);ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();
  ctx.setLineDash([]);
}
function hwClear(){hwCanvases.forEach(function(c){drawGuide(c.getContext('2d'),c.width,c.height);});}
function hwReveal(){
  document.querySelectorAll('.hwans').forEach(function(a){a.style.display='grid';});
  el('selfMark').style.display='flex';
  var q=round[idx];
  el('qtext').textContent='对一对：'+q.w+'（'+q.py+'）— 写对了吗？';
}
function hwMark(ok){
  var q=round[idx];
  el('selfMark').style.display='none';
  scoreQ(ok?1:0,1,q, ok?null:'没关系，进错题本多练几次就记住啦！');
}

/* ---------- report ---------- */
function showReport(){
  var logs=todayLog();
  var area=el('reportArea');
  if(!logs.length){area.innerHTML='<div class="rep"><h3>🏅 今日报告</h3><div class="repnote">今天还没有练习记录，先去做几道题吧！</div></div>';return;}
  var by={};
  logs.forEach(function(x){var k=x.subj;if(!by[k])by[k]={score:0,total:0,n:0,rounds:0};by[k].score+=x.score;by[k].total+=x.total;by[k].n+=x.n;by[k].rounds++;});
  var html='<div class="rep"><h3>🏅 '+today()+' 学习报告</h3>';
  var best=null,weak=null;
  Object.keys(by).forEach(function(k){
    var b=by[k],pct=b.total?Math.round(b.score/b.total*100):0;
    var S=SUBJ[k]||{name:'错题闯关',hex:'#7c6cf0',icon:'📕'};
    if(k!=='eb'){if(!best||pct>best.pct)best={k:k,pct:pct};if(!weak||pct<weak.pct)weak={k:k,pct:pct};}
    html+='<div class="repbar"><div class="lab"><span>'+S.icon+' '+S.name+'（'+b.rounds+' 轮 · '+b.n+' 题）</span><span>'+b.score+'/'+b.total+' · '+pct+'%</span></div><div class="track"><div class="fill" data-w="'+pct+'" style="background:'+S.hex+'"></div></div></div>';
  });
  var total=logs.reduce(function(a,x){return a+x.n;},0);
  var starsToday=logs.reduce(function(a,x){return a+x.score;},0);
  html+='<div class="repnote">今天共完成 <b>'+total+'</b> 题，赢得 <b>'+starsToday+'</b> ⭐';
  if(best&&weak&&best.k!==weak.k)html+='；最强的是 <b>'+SUBJ[best.k].name+'</b>（'+best.pct+'%），<b>'+SUBJ[weak.k].name+'</b>（'+weak.pct+'%）可以去错题闯关加强哦';
  html+='！'+(goalReached()?' 今日任务达成 ✅，奖励游戏已解锁！':' 完成 '+GOAL+' 题解锁奖励游戏🎮。')+'</div></div>';
  area.innerHTML=html;
  setTimeout(function(){document.querySelectorAll('.rep .fill').forEach(function(f){f.style.width=f.dataset.w+'%';});},60);
}

/* ---------- reward game: star catcher ---------- */
var G={running:false,score:0,time:30,items:[],timer:null,raf:null};
function tryGame(){
  if(!goalReached()){alert('先完成今日 '+GOAL+' 道题，就能解锁奖励游戏啦！💪');return;}
  el('gameOverlay').style.display='grid';
}
function gameClose(){gameStop();el('gameOverlay').style.display='none';renderHome();}
function gameStop(){G.running=false;clearInterval(G.timer);cancelAnimationFrame(G.raf);}
function gameStart(){
  gameStop();
  G.running=true;G.score=0;G.time=30;G.items=[];
  el('gScore').textContent=0;el('gTime').textContent=30;el('gBtn').textContent='重新开始';
  var c=el('gameCanvas'),ctx=c.getContext('2d');
  var spawn=setInterval(function(){
    if(!G.running)return clearInterval(spawn);
    G.items.push({x:30+Math.random()*(c.width-60),y:-20,v:1.6+Math.random()*2.2,bomb:Math.random()<0.22,r:22});
  },520);
  G.timer=setInterval(function(){
    G.time--;el('gTime').textContent=G.time;
    if(G.time<=0){gameStop();
      var bonus=Math.max(0,Math.min(20,G.score));
      DB.stars+=bonus;save();popStars();
      ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,c.width,c.height);
      ctx.fillStyle='#fff';ctx.font='bold 30px sans-serif';ctx.textAlign='center';
      ctx.fillText('得分 '+G.score+'，奖励 +'+bonus+' ⭐',c.width/2,c.height/2);
      bigBurst();
    }
  },1000);
  function tap(e){
    if(!G.running)return;e.preventDefault();
    var r=c.getBoundingClientRect();
    var pt=e.touches?e.touches[0]:e;
    var x=(pt.clientX-r.left)*(c.width/r.width),y=(pt.clientY-r.top)*(c.height/r.height);
    for(var i=G.items.length-1;i>=0;i--){
      var it=G.items[i];
      if(Math.hypot(it.x-x,it.y-y)<it.r+14){
        G.score+=it.bomb?-2:1;if(G.score<0)G.score=0;
        el('gScore').textContent=G.score;
        G.items.splice(i,1);break;
      }
    }
  }
  c.onpointerdown=tap;
  (function loop(){
    if(!G.running)return;
    ctx.clearRect(0,0,c.width,c.height);
    ctx.font='34px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    G.items.forEach(function(it){it.y+=it.v;ctx.fillText(it.bomb?'💣':'⭐',it.x,it.y);});
    G.items=G.items.filter(function(it){return it.y<c.height+30;});
    G.raf=requestAnimationFrame(loop);
  })();
}

/* ---------- backup ---------- */
function exportData(){
  var blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='yeyeyeye-progress.json';a.click();
}
function importData(inp){
  var f=inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){try{DB=JSON.parse(r.result);save();renderHome();alert('导入成功！');}catch(e){alert('文件无法读取，请选择本应用导出的 JSON 文件。');}};
  r.readAsText(f);
}

/* ---------- boot ---------- */
['en','ma','sc','cl'].forEach(renderSubject);
renderHome();
</script>
